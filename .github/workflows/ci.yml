name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Pubblica la versione di package.json (crea il tag vX.Y.Z e la release)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Manual run: installers as workflow artifacts, nothing is published.
  package:
    needs: check
    if: github.event_name == 'workflow_dispatch' && !inputs.release
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Widevine VMP signing (castlabs EVS), used by the afterPack hook on Windows and macOS.
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest' && env.EVS_ACCOUNT_NAME != ''
        with:
          python-version: '3.12'
      - name: Castlabs EVS login
        if: matrix.os != 'ubuntu-latest' && env.EVS_ACCOUNT_NAME != ''
        shell: bash
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ksuite-browser-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # Tag vX.Y.Z (or a manual run with "release"): draft release -> installers and update files
  # from the three systems -> published release.
  release-draft:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # A pushed tag must match package.json; a manual run takes the version from package.json itself.
      - run: node scripts/check-release.mjs "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}"
      # On a manual run the release creates the tag on the commit being built.
      - run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "kSuite Browser $TAG" --generate-notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-build:
    needs: release-draft
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Widevine VMP signing (castlabs EVS), used by the afterPack hook on Windows and macOS.
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest' && env.EVS_ACCOUNT_NAME != ''
        with:
          python-version: '3.12'
      - name: Castlabs EVS login
        if: matrix.os != 'ubuntu-latest' && env.EVS_ACCOUNT_NAME != ''
        shell: bash
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
      # Uploads installers plus latest*.yml (read by the in-app updater) to the draft release.
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  release-publish:
    needs: [release-draft, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          TAG: ${{ needs.release-draft.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
