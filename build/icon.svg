<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="0.55" stop-color="#3264f0"/>
      <stop offset="1" stop-color="#22307f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1440" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS-style squircle with margin, so the icon sits well next to system icons -->
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#shine)"/>
  <!-- the veil: two folds drawing a V, the second one see-through -->
  <path d="M242 282 Q 310 289 350 296 Q 444 431 512 782 Q 377 525 242 282 Z" fill="#ffffff" fill-opacity="0.97"/>
  <path d="M782 282 Q 714 289 674 296 Q 580 431 512 782 Q 647 525 782 282 Z" fill="#ffffff" fill-opacity="0.58"/>
</svg>
