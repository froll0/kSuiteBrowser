<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3fb4ff"/>
      <stop offset="0.55" stop-color="#2a7cf5"/>
      <stop offset="1" stop-color="#3a44de"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1b5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS-style squircle with margin, so the icon sits well next to system icons -->
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#shine)"/>
  <!-- orbit: the web around the suite -->
  <ellipse cx="512" cy="512" rx="330" ry="150" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="30" transform="rotate(-28 512 512)"/>
  <!-- the k -->
  <g fill="none" stroke="#ffffff" stroke-width="84" stroke-linecap="round" stroke-linejoin="round">
    <path d="M404 268V756"/>
    <path d="M650 410 432 590"/>
    <path d="M522 518 664 756"/>
  </g>
  <circle cx="730" cy="330" r="34" fill="#ffffff"/>
</svg>
