<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Nuova scheda</title>
  <link rel="stylesheet" href="page.css" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <main class="newtab">
    <div class="brand"><span id="logo"></span><h1 id="greeting"></h1></div>
    <p id="private-note" hidden>Cronologia, cookie, dati dei siti e password non vengono salvati: tutto sparisce quando chiudi questa finestra. I siti possono comunque vedere il tuo indirizzo IP.</p>
    <form id="search-form" role="search" autocomplete="off">
      <span class="search-icon" data-icon="search" data-size="18"></span>
      <input id="search" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list"
             aria-expanded="false" aria-controls="suggestions" aria-label="Cerca o inserisci un indirizzo" />
      <ul id="suggestions" role="listbox" aria-label="Suggerimenti" hidden></ul>
    </form>
    <section id="top-sites" aria-label="Scorciatoie"></section>
    <p id="restore" hidden><button class="link" id="restore-btn" data-icon="refresh" data-size="14">Ripristina i siti rimossi</button></p>
    <section id="recent" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title">Chiuse di recente</h2>
      <ul id="recent-list"></ul>
    </section>
    <section aria-labelledby="apps-title">
      <h2 id="apps-title">Le tue app</h2>
      <div id="apps" class="apps"></div>
    </section>
  </main>
  <dialog id="shortcut-dialog" aria-labelledby="shortcut-title">
    <form method="dialog" id="shortcut-form">
      <h2 id="shortcut-title">Aggiungi una scorciatoia</h2>
      <label>Nome<input id="shortcut-name" type="text" maxlength="60" autocomplete="off" /></label>
      <label>Indirizzo<input id="shortcut-url" type="text" required autocomplete="off" spellcheck="false" placeholder="example.com" /></label>
      <p id="shortcut-error" class="message error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="shortcut-cancel">Annulla</button>
        <button type="submit" class="primary" id="shortcut-save">Salva</button>
      </div>
    </form>
  </dialog>
  <script src="newtab.js"></script>
</body>
</html>
