<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data: ksuite:; font-src 'self'" />
  <title>kSuite Browser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="chrome">
    <div id="tabstrip-row">
      <span id="private-badge" title="Finestra privata: cronologia, cookie e dati vengono eliminati alla chiusura">Privata</span>
      <div id="tabstrip" role="tablist"></div>
    </div>
    <div id="toolbar">
      <button id="btn-back" class="icon" title="Indietro (Alt+←)" aria-label="Indietro">&#8592;</button>
      <button id="btn-forward" class="icon" title="Avanti (Alt+→)" aria-label="Avanti">&#8594;</button>
      <button id="btn-reload" class="icon" title="Ricarica (Ctrl+R)" aria-label="Ricarica">&#8635;</button>
      <form id="omnibox-form">
        <input id="omnibox" type="text" spellcheck="false" autocomplete="off" role="combobox" aria-autocomplete="list"
               aria-expanded="false" placeholder="Cerca o inserisci un indirizzo" aria-label="Indirizzo" />
        <button id="btn-zoom" type="button" class="pill" title="Ripristina lo zoom (Ctrl+0)" hidden></button>
        <button id="btn-star" type="button" class="star" title="Aggiungi ai preferiti (Ctrl+D)" aria-label="Aggiungi ai preferiti">&#9734;</button>
      </form>
      <button id="btn-shield" class="icon shield" title="Protezioni" aria-label="Protezioni"><span class="glyph">&#128737;</span><span class="count"></span></button>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <button id="btn-panel" class="icon" title="Pannello kSuite (Ctrl+Shift+K)" aria-label="Pannello kSuite">&#9776;</button>
      <button id="btn-menu" class="icon" title="Menu" aria-label="Menu">&#8942;</button>
    </div>
    <div id="bookmarks-bar" aria-label="Barra dei preferiti">
      <div id="bookmarks-items"></div>
      <button id="btn-all-bookmarks" class="bookmark" title="Tutti i preferiti">Tutti i preferiti ▾</button>
    </div>
    <div id="infobar" role="alertdialog" aria-live="polite" hidden></div>
  </header>
  <div id="body">
    <nav id="sidebar" aria-label="App kSuite"></nav>
    <main id="content"></main>
    <aside id="panel" aria-label="Pannello kSuite">
      <div id="panel-tabs" role="tablist"></div>
      <div id="panel-body"></div>
    </aside>
  </div>
  <div id="findbar" role="search" hidden>
    <input id="find-input" type="text" placeholder="Trova nella pagina" aria-label="Trova nella pagina" spellcheck="false" />
    <span id="find-count" aria-live="polite"></span>
    <button id="find-prev" class="icon" title="Precedente (Shift+Invio)" aria-label="Risultato precedente">&#8593;</button>
    <button id="find-next" class="icon" title="Successivo (Invio)" aria-label="Risultato successivo">&#8595;</button>
    <label class="find-case"><input id="find-case" type="checkbox" /> Maiuscole/minuscole</label>
    <button id="find-close" class="icon" title="Chiudi (Esc)" aria-label="Chiudi la ricerca">&#10005;</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
