<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data: ksuite:; font-src 'self'" />
  <title>kSuite Browser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="chrome">
    <div id="topbar">
      <span id="private-badge" title="Finestra privata: cronologia, cookie e dati vengono eliminati alla chiusura"><span data-icon="eyeOff" data-size="14"></span>Privata</span>
      <div id="tabstrip" role="tablist" aria-label="Schede"></div>
      <div id="toolbar" role="toolbar" aria-label="Barra degli strumenti">
        <div id="tb-start" class="group"></div>
        <form id="omnibox-form" role="search">
          <button id="site-info" type="button" class="site-info" title="Informazioni sul sito" aria-label="Informazioni sul sito"></button>
          <input id="omnibox" type="text" spellcheck="false" autocomplete="off" role="combobox" aria-autocomplete="list"
                 aria-expanded="false" placeholder="Cerca o inserisci un indirizzo" aria-label="Indirizzo" />
          <button id="btn-zoom" type="button" class="pill" title="Ripristina lo zoom (Ctrl+0)" hidden></button>
          <button id="btn-reader" type="button" class="icon-btn small" data-icon="bookOpen" data-size="16" title="Modalità lettura (F9)" aria-label="Modalità lettura" aria-pressed="false" hidden></button>
          <button id="btn-star" type="button" class="icon-btn small" data-icon="star" data-size="16" title="Aggiungi ai preferiti (Ctrl+D)" aria-label="Aggiungi ai preferiti"></button>
        </form>
        <div id="tb-end" class="group"></div>
        <button id="btn-menu" class="icon-btn" data-icon="more" title="Menu" aria-label="Menu"></button>
      </div>
      <div id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <div id="toolbar-row"></div>
    <div id="bookmarks-bar" aria-label="Barra dei preferiti">
      <div id="bookmarks-items"></div>
      <button id="btn-all-bookmarks" class="bookmark more" title="Tutti i preferiti"><span data-icon="folder" data-size="15"></span><span class="label">Tutti i preferiti</span></button>
    </div>
    <div id="infobar" role="alertdialog" aria-live="polite" hidden></div>
  </header>
  <div id="body">
    <nav id="sidebar" aria-label="App kSuite">
      <div id="sidebar-apps"></div>
      <button id="btn-settings" class="rail-btn" data-icon="settings" title="Impostazioni (Ctrl+,)" aria-label="Impostazioni"></button>
    </nav>
    <aside id="sidetabs" aria-label="Schede">
      <div class="sidetabs-head">
        <button id="btn-side-collapse" class="icon-btn small" data-icon="panelLeftClose" data-size="16" title="Riduci la colonna delle schede" aria-label="Riduci la colonna delle schede"></button>
        <button id="btn-side-search" class="icon-btn small" data-icon="search" data-size="16" title="Cerca tra le schede (Ctrl+Shift+A)" aria-label="Cerca tra le schede"></button>
      </div>
      <div id="sidetabs-list"></div>
      <div id="sidetabs-resize" title="Trascina per cambiare la larghezza" aria-hidden="true"></div>
    </aside>
    <main id="content"></main>
    <aside id="panel" aria-label="Pannello kSuite">
      <div class="panel-header">
        <div id="panel-tabs" role="tablist"></div>
        <button id="panel-close" class="icon-btn small" data-icon="close" data-size="16" title="Chiudi il pannello" aria-label="Chiudi il pannello"></button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </div>
  <div id="findbar" role="search" hidden>
    <span class="find-field">
      <span data-icon="search" data-size="15"></span>
      <input id="find-input" type="text" placeholder="Trova nella pagina" aria-label="Trova nella pagina" spellcheck="false" />
      <span id="find-count" aria-live="polite"></span>
    </span>
    <button id="find-prev" class="icon-btn small" data-icon="chevronUp" title="Precedente (Shift+Invio)" aria-label="Risultato precedente"></button>
    <button id="find-next" class="icon-btn small" data-icon="chevronDown" title="Successivo (Invio)" aria-label="Risultato successivo"></button>
    <label class="find-case" title="Distingui maiuscole e minuscole"><input id="find-case" type="checkbox" /><span data-icon="caseSensitive" data-size="16"></span><span>Maiuscole/minuscole</span></label>
    <button id="find-close" class="icon-btn small" data-icon="close" data-size="16" title="Chiudi (Esc)" aria-label="Chiudi la ricerca"></button>
  </div>
  <script src="app.js"></script>
</body>
</html>
